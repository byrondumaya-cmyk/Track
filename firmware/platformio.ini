; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html

; ── Shared base configuration ─────────────────────────────────
[common]
platform  = espressif32
board     = esp32dev
framework = arduino

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D TINY_GSM_MODEM_A7672X
    -D UART_BAUD=115200

; All required libraries:
;   TinyGSM       — LTE modem (GNSS + data)
;   ArduinoJson   — JSON serialization
;   StreamDebugger — modem serial debug (optional, TinyGSM dep)
; WiFi, WebServer, DNSServer, ArduinoOTA, HTTPClient are all
; part of the ESP32 Arduino core — no extra lib_deps needed.
lib_deps =
    https://github.com/vshymanskyy/TinyGSM.git
    vshymanskyy/StreamDebugger @ ^1.0.1
    bblanchon/ArduinoJson @ ^7.0.4

; ── Wired USB upload (first-time flash) ───────────────────────
[env:esp32dev]
extends       = common
monitor_speed = 115200
upload_speed  = 921600

